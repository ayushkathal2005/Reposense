<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RepoSense — AI Repository Intelligence</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-elements">
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
    </div>

    <main class="container">
        <header class="header">
            <h1 class="logo">Repo<span>Sense</span></h1>
            <p class="subtitle">Understand any codebase instantly via our Vector-Knowledge Graph Pipeline</p>
        </header>

        <section id="ingest-section" class="glass-panel active">
            <h2>Connect Repository</h2>
            <p>Enter a GitHub repository URL to begin parsing, embedding, and graphing.</p>
            <div class="input-group">
                <input type="text" id="repo-url" placeholder="https://github.com/octocat/Hello-World">
                <button id="btn-ingest" class="btn-primary">Ingest Codebase</button>
            </div>
            <div id="status-container" class="hidden">
                <div class="spinner"></div>
                <p id="status-text">Initializing...</p>
            </div>
        </section>

        <section id="query-section" class="glass-panel hidden">
            <h2>Query Knowledge Graph</h2>
            <div class="chat-container" id="chat-container">
                <!-- Messages go here -->
            </div>
            
            <div class="input-group">
                <input type="text" id="query-input" placeholder="e.g. How does authentication work?">
                <button id="btn-query" class="btn-primary">Ask RepoSense</button>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
